<div *ngIf="owner">
  <h2>Owner Details</h2>
  <p>
    <label>Name:</label>
    <input [(ngModel)]="name">
  </p>

  <p>
    <label>Surname:</label>
    <input [(ngModel)]="lastName" name="lastName" placeholder="Enter surname">
  </p>

  <p>
    <label>Phone:</label>
    <input [(ngModel)]="phone" name="phone" placeholder="Enter phone">
  </p>

  <form [formGroup]="carForm">

    <p>
      <label>Select Car:</label>
      <select formControlName="car">
        <option [ngValue]="null" disabled>Select Car</option>
        <option *ngFor="let car of cars" [ngValue]="car.id">{{car.number}}</option>
      </select>
    </p>

  </form>

  <form [formGroup]="orderForm">

    <p>
      <label>Select Order:</label>
      <select formControlName="order">
        <option [ngValue]="null" disabled>Select Order</option>
        <option *ngFor="let order of orders" [ngValue]="order.id">{{order.description}}</option>
      </select>

    </p>

  </form>

  <div class="button-container">
    <button (click)="goBack()">PREV</button>
    <button (click)="save()" [disabled]="!name || !lastName || !phone">NEXT</button>
  </div>
</div>
