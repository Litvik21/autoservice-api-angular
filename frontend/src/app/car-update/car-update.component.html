<div *ngIf="car">
  <h2>Car Details</h2>
  <p>
    <label>Brand:</label>
    <input [(ngModel)]="carBrand">
  </p>
  <p>
    <label>Model:</label>
    <input [(ngModel)]="carModel">
  </p>
  <p>
    <label>Year:</label>
    <input [(ngModel)]="carYear">
  </p>
  <p>
    <label>VIN number:</label>
    <input [(ngModel)]="carNumber">
  </p>

  <form [formGroup]="contactForm">
    <p>
      <label>Select Owner:</label>
      <select formControlName="owner">
        <option [ngValue]="null" disabled>Select Owner</option>
        <option *ngFor="let owner of owners" [ngValue]="owner.id">{{owner.name + " " + owner.lastName}}</option>
      </select>
    </p>
  </form>

  <div class="button-container">
    <button (click)="goBack()">PREV</button>
    <button (click)="save()" [disabled]="!carBrand || !carModel || !carYear || !carNumber || !contactForm.get('owner')?.value">SAVE</button>
  </div>
</div>
