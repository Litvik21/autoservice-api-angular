<div *ngIf="mechanic">
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Surname</th>
      <th>Salary</th>
    </tr>
    </thead>
    <tbody>
    <td>{{ mechanic.id }}</td>
    <td>{{ mechanic.name }}</td>
    <td>{{ mechanic.lastName }}</td>
    <td>{{ salary }}</td>
    </tbody>
  </table>
  <div class="button-container">
    <button (click)="goBack()" >PREV</button>
  </div>
</div>
