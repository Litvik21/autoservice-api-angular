<h2>Add mechanic</h2>
<p>
  <label>Name:</label>
  <input [(ngModel)]="mechanicName">
</p>

<p>
  <label>Surname:</label>
  <input [(ngModel)]="lastName">
</p>

<div class="button-container">
  <button (click)="prev()">PREV</button>
  <button
    (click)="add()"
    [disabled]="
      !mechanicName ||
      !lastName
    "
  >
    NEXT
  </button>
</div>
