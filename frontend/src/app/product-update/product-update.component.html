<div *ngIf="product">
  <p>
    <label>Title:</label>
    <input [(ngModel)]="title">
  </p>
  <p>
    <label>Price:</label>
    <input [(ngModel)]="price">
  </p>

  <div class="button-container">
    <button (click)="goBack()">PREV</button>
    <button
      (click)="save()"
      [disabled]="
      !title ||
      !price
    "
    >
      SAVE
    </button>
  </div>
</div>
