<h2>Add product</h2>
<p>
  <label>Title:</label>
  <input [(ngModel)]="title">
</p>
<p>
  <label>Price:</label>
  <input [(ngModel)]="price">
</p>

<div class="button-container">
  <button (click)="prev()">PREV</button>
  <button
    (click)="add()"
    [disabled]="
      !title ||
      !price
    "
  >
    NEXT
  </button>
</div>
