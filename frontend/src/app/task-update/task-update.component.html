<div *ngIf="task">
  <p>
    <label>Title:</label>
    <input [(ngModel)]="title">
  </p>

  <form [formGroup]="typeOfTaskForm">

    <p>
      <label>Select type of task:</label>
      <select formControlName="type">
        <option [ngValue]="null" disabled>Select Type</option>
        <option *ngFor="let type of types"
                [value]="type">
          {{typeOfTaskMapping[type]}}
        </option>
      </select>
    </p>

  </form>

<!--  <form [formGroup]="orderForm">-->

<!--    <p>-->
<!--      <label>Select Order</label>-->
<!--      <select formControlName="order">-->
<!--        <option [ngValue]="null" disabled>Select Order</option>-->
<!--        <option *ngFor="let order of orders" [ngValue]="order.id">{{order.description}}</option>-->
<!--      </select>-->
<!--    </p>-->

<!--  </form>-->
  <form [formGroup]="mechanicForm">

    <p>
      <label>Select Mechanic</label>
      <select formControlName="mechanic">
        <option [ngValue]="null" disabled>Select Mechanic</option>
        <option *ngFor="let mechanic of mechanics" [ngValue]="mechanic.id">{{mechanic.name + " " + mechanic.lastName}}</option>
      </select>
    </p>

  </form>
  <p>
    <label>Price:</label>
    <input [(ngModel)]="price">
  </p>
  <form [formGroup]="paymentStatusForm">

    <p>
      <label>Select payment status:</label>
      <select formControlName="status">
        <option [ngValue]="null" disabled>Select Status</option>
        <option *ngFor="let status of statuses"
                [value]="status">
          {{paymentStatusMapping[status]}}
        </option>
      </select>
    </p>

  </form>

  <div class="button-container">
    <button (click)="goBack()">PREV</button>
    <button
      (click)="save()"
      [disabled]="
      !title ||
      !typeOfTaskForm.get('type')?.value ||
      !mechanicForm.get('mechanic')?.value ||
      !price ||
      !paymentStatusForm.get('status')?.value
    "
    >
      SAVE
    </button>
  </div>
</div>
